name: 同步特定文件夹 (Sync specific folder)

on:
  schedule:
    - cron: '0 0 * * *' # 每天自动执行
  workflow_dispatch: # 允许手动点击运行

  # 👇 新增这一段：强制要求 GitHub Actions 使用 Node.js 24 运行，消除过期警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  sync_folder:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出你自己的仓库代码
      - name: 检出本地仓库 (Checkout local repo)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 将上游仓库拉取到一个名为 "upstream_repo" 的临时文件夹中
      - name: 检出上游仓库 (Checkout upstream repo)
        uses: actions/checkout@v4
        with:
          repository: Yuan1z0825/nature-skills
          path: upstream_repo
          ref: main # 如果上游使用的是 master 分支，请将此处改为 master

      # 3. 使用 rsync 同步文件夹内容
      - name: 提取并同步目标文件夹
        run: |
          # 确保你仓库的 "nature skills" 文件夹存在，注意路径中的空格已用引号包裹
          mkdir -p "mods-nature-skills"
          
          # 使用 rsync 进行精确同步（--delete 参数保证上游删除的文件，本地也会被删除）
          # 注意：路径末尾的斜杠 / 非常重要，表示同步文件夹内的内容，而不是连同外层文件夹一起复制
          rsync -av --delete upstream_repo/skills/ "mods-nature-skills/"
          
          # 同步完成后，删除临时拉取的上游仓库文件夹，保持环境整洁
          rm -rf upstream_repo

      # 4. 检查是否有文件改动，并提交推送到你的仓库
      - name: 提交并推送更改 (Commit and Push)
        run: |
          # 配置 GitHub Actions 机器人的全局身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 将 "nature skills" 文件夹的变化添加到暂存区
          git add "mods-nature-skills"
          
          # 检查是否有文件变动。如果有，则提交并推送；如果没有，则输出提示
          if git diff --staged --quiet; then
            echo "上游文件夹无更新，无需提交。"
          else
            git commit -m "Auto-sync: 更新 mods-nature-skills 文件夹内容"
            git push
          fi